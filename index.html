<head>
<meta charset="utf-8">

<title>Planer Maturalny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app; summary card on top, day-by-day plan below, fixed tab bar at the bottom */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface-2:#E3ECE5; --ink:#132019; --muted:#5D6E64; --line:#D3DFD6;
  --accent:#17804A; --accent-ink:#FFFFFF; --accent-soft:#D5EDDD;
  --g-accent:#17804A; --g-soft:#D5EDDD; --g-ink:#FFFFFF; --m-accent:#3552C8; --m-soft:#DCE3FB; --m-ink:#FFFFFF; --z-accent:#B4561C; --z-soft:#F8E3D3; --z-ink:#FFFFFF;
  --warn:#B9770B; --warn-soft:#FBEBCB; --bad:#C63B30; --bad-soft:#F8DAD6; --flame:#E2561F;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Onest", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16211B; --surface-2:#1E2B24; --ink:#E5EEE8; --muted:#93A69A; --line:#2A3A31;
  --accent:#43BE78; --accent-ink:#06150C; --accent-soft:#1D3A29;
  --g-accent:#43BE78; --g-soft:#1D3A29; --g-ink:#06150C; --m-accent:#86A0FF; --m-soft:#1F2A4D; --m-ink:#0A1230; --z-accent:#F29A62; --z-soft:#3C2617; --z-ink:#241104;
  --warn:#E5A93A; --warn-soft:#3A2E14; --bad:#F0796E; --bad-soft:#3E1F1C; --flame:#FF7A42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16211B; --surface-2:#1E2B24; --ink:#E5EEE8; --muted:#93A69A; --line:#2A3A31;
  --accent:#43BE78; --accent-ink:#06150C; --accent-soft:#1D3A29;
  --g-accent:#43BE78; --g-soft:#1D3A29; --g-ink:#06150C; --m-accent:#86A0FF; --m-soft:#1F2A4D; --m-ink:#0A1230; --z-accent:#F29A62; --z-soft:#3C2617; --z-ink:#241104;
  --warn:#E5A93A; --warn-soft:#3A2E14; --bad:#F0796E; --bad-soft:#3E1F1C; --flame:#FF7A42; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:12px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.subj{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[disabled]{opacity:.55;cursor:default}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.pct{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em}
.pct small{font-size:24px;margin-left:2px}
.streak{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.streak svg{width:18px;height:18px}
.streak.off{opacity:.7}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:currentColor;transition:width .4s ease}
.hero-foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500;flex-wrap:wrap}

/* status */
.status{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start}
.status.ok{background:var(--accent-soft)}
.status.warn{background:var(--warn-soft)}
.status.bad{background:var(--bad-soft)}
.status .ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--surface)}
.status.ok .ico{background:var(--accent)} .status.warn .ico{background:var(--warn)} .status.bad .ico{background:var(--bad)}
.status h3{font-size:17px;font-weight:700;margin-bottom:2px}
.status p{margin:0;font-size:14.5px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:500;font-size:19px}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}

/* days */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-size:20px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.day{display:flex;flex-direction:column;gap:10px}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.day-h h3{font-size:18px;font-weight:700}
.day-h h3 .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:3px}
.day-h .meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;margin-top:2px}
.task{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:-.02em}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.task .t0{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.task .t1{font-weight:700;font-size:15.5px}
.subj-mat{--accent:var(--m-accent);--accent-soft:var(--m-soft);--accent-ink:var(--m-ink)}
.subj-zad{--accent:var(--z-accent);--accent-soft:var(--z-soft);--accent-ink:var(--z-ink)}
.srows{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;font-weight:600;font-size:15px}
.srow:first-child{border-top:0}
.srow small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.srow[disabled]{color:var(--muted);cursor:default}
.sw{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.srow[aria-pressed="true"] .sw{background:var(--g-accent)}
.srow[aria-pressed="true"] .sw::after{left:21px}
.soon{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.slabel{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.dates input[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;text-align:left;font-size:15px}
.dates input[type=date]::-webkit-date-and-time-value{text-align:left}
.dates input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.mini{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini .btn{padding:8px 12px;font-size:14px}
.subj-bio{--accent:var(--g-accent);--accent-soft:var(--g-soft);--accent-ink:var(--g-ink)}
.rtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:1px}
.days button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.days button small{font-size:10px;font-weight:600;color:var(--muted)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.8}
.days button.taken{border-style:dashed}
.task .t2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .hrs{flex:none;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--ink)}
.task.done{background:var(--accent-soft);border-color:transparent}
.task.done .hrs{color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14.5px}
.skipbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.skipped .task{opacity:.45}

/* units list */
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.badge.long{font-size:11px;letter-spacing:-.04em}
.ugroup{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ugroup:first-child{margin-top:4px}
.ghead{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px;padding:0 2px 2px}
.ghead .gnum{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.ghead h3{font-size:17px;font-weight:700}
.ueb{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:-4px}
.ghead .gmeta{font-size:13px;color:var(--muted)}
.unit .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.unit .name{font-weight:700;font-size:15px;line-height:1.25}
.unit .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.mbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.unit.full .badge{background:var(--accent);color:var(--accent-ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{gap:16px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:16px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;line-height:1}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-display);font-weight:500;font-size:16px}
.topics{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.topic:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.topic[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.topic[aria-checked="true"] .box svg{opacity:1}
.topic .tx{flex:1;min-width:0;font-size:15px}
.topic .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.topic[aria-checked="true"] .tx{color:var(--muted)}
.topic.today-pick{background:var(--accent-soft)}

/* settings */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px}
.hint{font-size:13.5px;color:var(--muted);margin:0}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--warn)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
details[open] summary{margin-bottom:8px}
.backup{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-style:solid;color:var(--ink)}
.copy{text-align:center;font-size:12px;padding-block:8px}
.btn.tt{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;align-self:flex-start}
.faq{display:flex;flex-direction:column;gap:10px;font-size:14px}
.faq p{margin:0}
.install{border-color:var(--accent)}
.install.done{border-color:var(--accent);background:var(--accent-soft)}
.iguide{position:fixed;inset:0;z-index:50;background:rgba(6,14,10,.62);display:flex;flex-direction:column;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(16px,env(safe-area-inset-left,0px))}
.iguide.android,.iguide.inapp{justify-content:flex-end}
.iguide-card{background:var(--surface);color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.iguide-card h3{font-size:19px;font-weight:700}
.iguide-arrow{position:fixed;font-size:54px;line-height:1;color:#fff;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.5);animation:ibounce 1.1s ease-in-out infinite}
.iguide.ios .iguide-arrow{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%)}
.iguide.android .iguide-arrow,.iguide.inapp .iguide-arrow{right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px)}
@keyframes ibounce{0%,100%{translate:0 0}50%{translate:0 10px}}
.iguide.android .iguide-arrow,.iguide.inapp .iguide-arrow{animation-name:ibounceup}
@keyframes ibounceup{0%,100%{translate:0 0}50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.iguide-arrow{animation:none}}
.iguide.inapp .iguide-arrow{left:auto;bottom:auto;transform:none}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* tabbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<nav class="tabbar" aria-label="Nawigacja"><div class="in">
  <button data-tab="plan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg>Plan</button>
  <button data-tab="units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Działy</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ustawienia</button>
</div></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ======================= PROGRAM (podstawa programowa – matura 2027) ======================= */
const SUBJECTS = [{
  id:"bio", name:"Biologia rozszerzona", short:"Biologia roz.",
  units:[
  {id:"I",n:"I",name:"Chemizm życia",h:5,t:[
    "Makroelementy i pierwiastki biogenne – znaczenie biologiczne",
    "Mikroelementy: Fe, I, F",

const SUB=id=>SUBJECTS.find(s=>s.id===id);

const tid=(u,i)=>u.tids?u.tids[i]:`${u.id}.${i+1}`;
const isR=t=>t.startsWith("R:");

function topicH(u,i){const H=uHours(u);if(!u.w)return H/u.t.length;const W=u.wsum||(u.wsum=u.w.reduce((a,b)=>a+b,0));return H*u.w[i]/W}
function startD(sid){const s=cfg(sid).start,t=todayD();return s&&parse(s)>t?parse(s):t}
function findUnit(id){for(const s of SUBJECTS){const u=s.units.find(x=>x.id===id);if(u)return{u,s}}return null}
function totals(sid){let tot=0,done=0,todayH=0;const t=iso(todayD());
  for(const u of SUB(sid).units){const H=uHours(u);tot+=H;
    u.t.forEach((_,i)=>{const d=state.done[tid(u,i)];if(d){const per=topicH(u,i);done+=per;if(d===t)todayH+=per}})}
  return{tot,done,rem:Math.max(0,tot-done),todayH,pct:tot?done/tot*100:0}}
function isStudy(d,sid){return cfg(sid).days.includes(d.getDay())&&!state.skip.includes(iso(d))}
const anyStudy=d=>ACTIVE().some(s=>isStudy(d,s.id));
function schedule(sid,limitDays=500){
  const q=[];for(const u of SUB(sid).units){u.t.forEach((_,i)=>{if(!state.done[tid(u,i)])q.push({u,i,rem:topicH(u,i)})})}
  const out=[];const T=totals(sid);let d=startD(sid);const todayKey=iso(todayD());const hpd=cfg(sid).hpd;let finish=null;
  if(!cfg(sid).days.length||hpd<=0)return{days:out,finish:null};
  for(let k=0;k<limitDays&&q.length;k++,d=addDays(d,1)){
    if(!isStudy(d,sid))continue;
    let capH=hpd-(iso(d)===todayKey?T.todayH:0);const items=[];
    while(capH>1e-6&&q.length){const it=q[0];const take=Math.min(capH,it.rem);it.rem-=take;capH-=take;
      const last=items[items.length-1];
      if(last&&last.u===it.u){last.to=it.i;last.h+=take}else items.push({sid,u:it.u,from:it.i,to:it.i,h:take});
      if(it.rem<=1e-6)q.shift()}
    if(items.length)out.push({date:new Date(d),items});
    if(!q.length)finish=new Date(d)}
  return{days:out,finish}}

  for(const s of ACTIVE())for(const d of schedule(s.id).days){const k=iso(d.date);
    if(!map.has(k))map.set(k,{date:d.date,items:[]});map.get(k).items.push(...d.items)}
  return[...map.values()].sort((a,b)=>a.date-b.date)}

function taskCard(it){
  const u=it.u,s=SUB(it.sid);
  const num=i=>u.tids?u.tids[i].split(".").pop():i+1;
  const range=u.w?(it.from===it.to?`Zadanie ${num(it.from)}`:`Zadania ${num(it.from)}–${num(it.to)}`)+` · ${it.to-it.from+1} ${it.to===it.from?"zadanie":"zadań"}`
    :it.from===it.to?`Temat ${it.from+1}: ${tText(u.t[it.from])}`:`Tematy ${it.from+1}–${it.to+1}: ${tText(u.t[it.from])}`;
  return `<button class="task subj-${it.sid}" data-unit="${u.id}">${badge(u)}
   <span class="body"><span class="t0">${esc(s.short)}</span><span class="t1">${esc(u.name)}</span><span class="t2">${esc(range)}</span></span>
   <span class="hrs num">${fmtH(it.h)}</span></button>`}

function siblings(u){const f=findUnit(u.id);return f?f.s.units.filter(x=>x.n===u.n):[u]}
function ulabel(u){const sib=siblings(u);return sib.length>1?`${u.n}.${sib.indexOf(u)+1}`:u.n}

function unitRow(u,sid,single){const n=u.t.length,d=u.t.filter((_,i)=>state.done[tid(u,i)]).length;

function viewUnits(){

  <p class="hint">${esc(S.name)}: ${groups.length} działów · ${S.units.reduce((a,u)=>a+u.t.length,0)} ${noun(S.id)} · ${fmtH(T.tot)} łącznie.${split?` Duże działy są podzielone na części, żeby łatwiej je planować.`:""} Kliknij dział, żeby odhaczać ${isTasks(S.id)?"zadania":"tematy"} i zmieniać czas.</p>

      <h3>${esc(g.units[0].g||g.units[0].name)}</h3><span class="gmeta num">${g.units.length>1?`${g.units.length} części · `:""}${d}/${n} ${noun(S.id)}</span></div>
      ${g.units.map(u=>unitRow(u,S.id,g.units.length===1)).join("")}</section>`}).join("")}</div>`}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;confirmReset=false;render();scrollTo(0,0);return}
  if(b.dataset.tabGo){tab=b.dataset.tabGo;render();scrollTo(0,0);return}

  if(b.dataset.toggle){const id=b.dataset.toggle;
    if(state.enabled[id]&&ACTIVE().length===1){toast("Zostaw włączony chociaż jeden przedmiot");return}
    state.enabled[id]=!state.enabled[id];
    if(state.enabled[id]){state.subject=id;toast(`Włączono: ${SUB(id).short}`)}else if(state.subject===id){state.subject=ACTIVE()[0].id}
    commit();return}
  if(b.dataset.unit){openUnit=b.dataset.unit;$("#sheet").scrollTop=0;renderSheet();return}
  if(b.hasAttribute("data-close")){closeSheet();return}
  if(b.hasAttribute("data-more")){showDays+=8;render();return}
  if(b.dataset.skip){if(!state.skip.includes(b.dataset.skip))state.skip.push(b.dataset.skip);commit();toast("Plan przesunięty na kolejne dni");return}
  if(b.dataset.unskip){state.skip=state.skip.filter(s=>s!==b.dataset.unskip);commit();return}
  if(b.dataset.topic!==undefined){const{u}=findUnit(openUnit),k=tid(u,+b.dataset.topic);
    if(state.done[k])delete state.done[k];else state.done[k]=iso(todayD());commit();return}
  if(b.dataset.all!==undefined){const{u}=findUnit(openUnit);const t=iso(todayD());
    u.t.forEach((_,i)=>{const k=tid(u,i);if(b.dataset.all==="1"){if(!state.done[k])state.done[k]=t}else delete state.done[k]});commit();return}
  if(b.dataset.uh){const{u}=findUnit(openUnit);state.hours[u.id]=Math.max(0.5,uHours(u)+Number(b.dataset.uh));commit();return}
  if(b.dataset.hpd){const c=cfg(subj().id);c.hpd=Math.min(12,Math.max(0.5,c.hpd+Number(b.dataset.hpd)));commit();return}
  if(b.dataset.day){const d=+b.dataset.day,c=cfg(subj().id);
    if(c.days.includes(d))c.days=c.days.filter(x=>x!==d);
    else c.days=[...c.days,d];

  if(b.hasAttribute("data-copy")){const ta=$("#backup");try{await navigator.clipboard.writeText(ta.value);toast("Skopiowano")}catch(_){ta.focus();ta.select();toast("Zaznaczone – skopiuj ręcznie")}return}
  if(b.hasAttribute("data-import")){importText($("#backup").value);return}
  if(b.hasAttribute("data-dl")){
    if(!downloads){try{state.lastBackup=iso(todayD());const blob=new Blob([JSON.stringify(state)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`planer-matura-${iso(todayD())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);commit();toast("Kopia pobrana – sprawdź Pliki › Pobrane")}catch(_){toast("Nie udało się pobrać – użyj kopii jako tekst")}return}
    try{state.lastBackup=iso(todayD());await downloads.save({filename:`planer-matura-${iso(todayD())}.json`,data:JSON.stringify(state)});commit();toast("Kopia zapisana")}
    catch(err){state.lastBackup=undefined;try{const raw=localStorage.getItem(LS);if(raw)state.lastBackup=JSON.parse(raw).lastBackup}catch(_){}
      if(err&&err.code==="unavailable")toast("Pobieranie niedostępne – użyj kopii jako tekst");else toast("Nie zapisano kopii")}
    return}
  if(b.dataset.reset){if(b.dataset.reset==="ask")confirmReset=true;else if(b.dataset.reset==="yes"){const keep=state.settings,sub=state.subject,en=state.enabled;state=freshState();state.settings=keep;state.subject=sub;state.enabled=en;confirmReset=false;commit();toast("Wyczyszczono");return}else confirmReset=false;render();return}
});

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matura">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1411" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Planer Maturalny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app; summary card on top, day-by-day plan below, fixed tab bar at the bottom */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface-2:#E3ECE5; --ink:#132019; --muted:#5D6E64; --line:#D3DFD6;
  --accent:#17804A; --accent-ink:#FFFFFF; --accent-soft:#D5EDDD;
  --g-accent:#17804A; --g-soft:#D5EDDD; --g-ink:#FFFFFF; --m-accent:#3552C8; --m-soft:#DCE3FB; --m-ink:#FFFFFF; --z-accent:#B4561C; --z-soft:#F8E3D3; --z-ink:#FFFFFF; --c-accent:#7B3FB3; --c-soft:#ECDFF7; --c-ink:#FFFFFF;
  --warn:#B9770B; --warn-soft:#FBEBCB; --bad:#C63B30; --bad-soft:#F8DAD6; --flame:#E2561F;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Onest", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16211B; --surface-2:#1E2B24; --ink:#E5EEE8; --muted:#93A69A; --line:#2A3A31;
  --accent:#43BE78; --accent-ink:#06150C; --accent-soft:#1D3A29;
  --g-accent:#43BE78; --g-soft:#1D3A29; --g-ink:#06150C; --m-accent:#86A0FF; --m-soft:#1F2A4D; --m-ink:#0A1230; --z-accent:#F29A62; --z-soft:#3C2617; --z-ink:#241104; --c-accent:#C79CF2; --c-soft:#2E2140; --c-ink:#1A0B2A;
  --warn:#E5A93A; --warn-soft:#3A2E14; --bad:#F0796E; --bad-soft:#3E1F1C; --flame:#FF7A42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16211B; --surface-2:#1E2B24; --ink:#E5EEE8; --muted:#93A69A; --line:#2A3A31;
  --accent:#43BE78; --accent-ink:#06150C; --accent-soft:#1D3A29;
  --g-accent:#43BE78; --g-soft:#1D3A29; --g-ink:#06150C; --m-accent:#86A0FF; --m-soft:#1F2A4D; --m-ink:#0A1230; --z-accent:#F29A62; --z-soft:#3C2617; --z-ink:#241104; --c-accent:#C79CF2; --c-soft:#2E2140; --c-ink:#1A0B2A;
  --warn:#E5A93A; --warn-soft:#3A2E14; --bad:#F0796E; --bad-soft:#3E1F1C; --flame:#FF7A42; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:12px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.subj{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[disabled]{opacity:.55;cursor:default}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.pct{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em}
.pct small{font-size:24px;margin-left:2px}
.streak{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.streak svg{width:18px;height:18px}
.streak.off{opacity:.7}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:currentColor;transition:width .4s ease}
.hero-foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500;flex-wrap:wrap}

/* status */
.status{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start}
.status.ok{background:var(--accent-soft)}
.status.warn{background:var(--warn-soft)}
.status.bad{background:var(--bad-soft)}
.status .ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--surface)}
.status.ok .ico{background:var(--accent)} .status.warn .ico{background:var(--warn)} .status.bad .ico{background:var(--bad)}
.status h3{font-size:17px;font-weight:700;margin-bottom:2px}
.status p{margin:0;font-size:14.5px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:500;font-size:19px}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}

/* days */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-size:20px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.day{display:flex;flex-direction:column;gap:10px}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.day-h h3{font-size:18px;font-weight:700}
.day-h h3 .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:3px}
.day-h .meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;margin-top:2px}
.task{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:-.02em}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.task .t0{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.task .t1{font-weight:700;font-size:15.5px}
.subj-mat{--accent:var(--m-accent);--accent-soft:var(--m-soft);--accent-ink:var(--m-ink)}
.subj-zad{--accent:var(--z-accent);--accent-soft:var(--z-soft);--accent-ink:var(--z-ink)}
.subj-chem{--accent:var(--c-accent);--accent-soft:var(--c-soft);--accent-ink:var(--c-ink)}
.srows{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;font-weight:600;font-size:15px}
.srow:first-child{border-top:0}
.srow small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.srow[disabled]{color:var(--muted);cursor:default}
.sw{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.srow[aria-pressed="true"] .sw{background:var(--g-accent)}
.srow[aria-pressed="true"] .sw::after{left:21px}
.soon{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.slabel{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.dates input[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;text-align:left;font-size:15px}
.dates input[type=date]::-webkit-date-and-time-value{text-align:left}
.dates input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.mini{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini .btn{padding:8px 12px;font-size:14px}
.subj-bio{--accent:var(--g-accent);--accent-soft:var(--g-soft);--accent-ink:var(--g-ink)}
.rtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:1px}
.days button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.days button small{font-size:10px;font-weight:600;color:var(--muted)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.8}
.days button.taken{border-style:dashed}
.task .t2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .hrs{flex:none;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--ink)}
.task.done{background:var(--accent-soft);border-color:transparent}
.task.done .hrs{color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14.5px}
.skipbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.skipped .task{opacity:.45}

/* units list */
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.badge.long{font-size:11px;letter-spacing:-.04em}
.ugroup{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ugroup:first-child{margin-top:4px}
.ghead{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px;padding:0 2px 2px}
.ghead .gnum{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.ghead h3{font-size:17px;font-weight:700}
.ueb{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:-4px}
.ghead .gmeta{font-size:13px;color:var(--muted)}
.unit .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.unit .name{font-weight:700;font-size:15px;line-height:1.25}
.unit .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.mbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.unit.full .badge{background:var(--accent);color:var(--accent-ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{gap:16px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:16px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;line-height:1}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-display);font-weight:500;font-size:16px}
.topics{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tick{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;background:none;text-align:left;width:100%}
.topic:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.tick[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.tick[aria-checked="true"] .box svg{opacity:1}
.topic .tx{flex:1;min-width:0;font-size:15px}
.topic .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tick[aria-checked="true"] .tx{color:var(--muted)}
.topic.today-pick{background:var(--accent-soft)}

/* settings */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px}
.hint{font-size:13.5px;color:var(--muted);margin:0}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--warn)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
details[open] summary{margin-bottom:8px}
.backup{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-style:solid;color:var(--ink)}
.copy{text-align:center;font-size:12px;padding-block:8px}
.btn.tt{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;align-self:flex-start}
.faq{display:flex;flex-direction:column;gap:10px;font-size:14px}
.faq p{margin:0}
.install{border-color:var(--accent)}
.install.done{border-color:var(--accent);background:var(--accent-soft)}
.iguide{position:fixed;inset:0;z-index:70;background:rgba(6,14,10,.62);display:flex;flex-direction:column;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(16px,env(safe-area-inset-left,0px))}
.iguide.android,.iguide.inapp{justify-content:flex-end}
.iguide-card{background:var(--surface);color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.iguide-card h3{font-size:19px;font-weight:700}
.iguide-arrow{position:fixed;font-size:54px;line-height:1;color:#fff;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.5);animation:ibounce 1.1s ease-in-out infinite}
.iguide.ios .iguide-arrow{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%)}
.iguide.android .iguide-arrow,.iguide.inapp .iguide-arrow{right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px)}
@keyframes ibounce{0%,100%{translate:0 0}50%{translate:0 10px}}
.iguide.android .iguide-arrow,.iguide.inapp .iguide-arrow{animation-name:ibounceup}
@keyframes ibounceup{0%,100%{translate:0 0}50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.iguide-arrow{animation:none}}
.iguide.inapp .iguide-arrow{left:auto;bottom:auto;transform:none}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* tabbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.backlog{display:flex;flex-direction:column;gap:12px}
.backlog .sec-h h2{color:var(--bad)}
.bl-h{font-family:var(--f-display);font-weight:500;color:var(--bad)}
.backlog .task{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.backlog .task .t0{color:var(--bad)}
.backlog .day-h h3{font-size:15px;color:var(--muted)}
.done-note{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.modal{position:fixed;inset:0;z-index:45;background:rgba(6,14,10,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal-card h3{font-size:20px;font-weight:700}
.modal-card .link{align-self:center}
.cdline{font-size:13px;font-weight:600;opacity:.85;margin-top:2px}
.chartcard{gap:8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1.5}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}

const SUB=id=>SUBJECTS.find(s=>s.id===id);

function topicH(u,i){const H=uHours(u);if(!u.w)return H/u.t.length;const W=u.wsum||(u.wsum=u.w.reduce((a,b)=>a+b,0));return H*u.w[i]/W}

function totals(sid){let tot=0,done=0,todayH=0;const t=iso(todayD());
  for(const u of SUB(sid).units){const H=uHours(u);tot+=H;
    u.t.forEach((_,i)=>{const d=state.done[tid(u,i)];if(d){const per=topicH(u,i);done+=per;if(d===t)todayH+=per}})}
  return{tot,done,rem:Math.max(0,tot-done),todayH,pct:tot?done/tot*100:0}}
function isStudy(d,sid){return cfg(sid).days.includes(d.getDay())&&!state.skip.includes(iso(d))}
const anyStudy=d=>ACTIVE().some(s=>isStudy(d,s.id));
function schedule(sid,opts={}){const limitDays=500;
  const res=opts.plain?{}:frozenMap(true,true);const todayKey=iso(todayD());
  const q=[];for(const u of SUB(sid).units){u.t.forEach((_,i)=>{const t=tid(u,i);if(state.done[t])return;const rem=topicH(u,i)-(res[t]||0);if(rem>1e-6)q.push({u,i,rem})})}
  const out=[];const T=totals(sid);let d=startD(sid);
  const fz=state.frozen[todayKey];if(!opts.plain&&fz&&fz.s[sid]&&iso(d)===todayKey)d=addDays(d,1);const hpd=cfg(sid).hpd;let finish=null;
  if(!cfg(sid).days.length||hpd<=0)return{days:out,finish:null};
  for(let k=0;k<limitDays&&q.length;k++,d=addDays(d,1)){
    if(!isStudy(d,sid))continue;
    let capH=hpd-(iso(d)===todayKey?T.todayH:0);const items=[];
    while(capH>1e-6&&q.length){const it=q[0];const take=Math.min(capH,it.rem);it.rem-=take;capH-=take;
      const last=items[items.length-1];
      if(last&&last.u===it.u){last.to=it.i;last.h+=take}else items.push({sid,u:it.u,from:it.i,to:it.i,h:take});
      if(it.rem<=1e-6)q.shift()}

    if(!q.length)finish=new Date(d)}
  return{days:out,finish}}

function backlogSpread(){for(const d of backlogDays())state.frozen[d.key].it=state.frozen[d.key].it.filter(x=>!d.items.includes(x))}

/* --- powtórki i oceny --- */
const REV_INT=[3,7,30],REV_MIN=10;
const canReview=sid=>!isTasks(sid);
function onTicked(k){const r=TIDX[k];if(!r||!canReview(r.sid))return;state.rev[k]={lvl:0,due:iso(addDays(todayD(),REV_INT[0]))}}
function onUnticked(k){delete state.rev[k];delete state.rate[k]}
function setRate(k,v){state.rate[k]=v;const r=state.rev[k];
  if(v==="weak"){if(r){r.due=iso(addDays(todayD(),2));r.lvl=Math.max(0,r.lvl-1)}else state.rev[k]={lvl:0,due:iso(addDays(todayD(),2))}}}
function reviewAction(k,ok){const r=state.rev[k];if(!r)return;
  if(ok){state.rate[k]="ok";r.lvl++;if(r.lvl>=REV_INT.length){delete state.rev[k];return"mastered"}r.due=iso(addDays(todayD(),REV_INT[r.lvl]))}
  else{state.rate[k]="weak";r.lvl=Math.max(0,r.lvl-1);r.due=iso(addDays(todayD(),2))}}
function dueReviews(){const tk=iso(todayD());
  return Object.entries(state.rev).filter(([k,r])=>r.due<=tk&&TIDX[k]&&state.enabled[TIDX[k].sid]&&state.done[k]).map(([k,r])=>({k,r,...TIDX[k]})).sort((a,b)=>a.r.due<b.r.due?-1:1)}
function weakTopics(sid){return Object.entries(state.rate).filter(([k,v])=>v==="weak"&&TIDX[k]&&TIDX[k].sid===sid&&state.done[k]).map(([k])=>({k,...TIDX[k]}))}
function addGroupToReviews(sid,n){let c=0;const tk=iso(todayD());
  for(const u of SUB(sid).units.filter(u=>u.n===n))u.t.forEach((_,i)=>{const k=tid(u,i);if(state.done[k]){state.rev[k]={lvl:0,due:tk};state.rate[k]="weak";c++}});return c}

/* --- wykres postępu: plan a rzeczywistość --- */
function chartStart(sid){let s=parse(state.createdAt||iso(todayD()));
  for(const u of SUB(sid).units)u.t.forEach((_,i)=>{const d=state.done[tid(u,i)];if(d&&parse(d)<s)s=parse(d)});
  const st=cfg(sid).start;if(st&&parse(st)<s)s=parse(st);return s}
function studyDaysIn(sid,a,b){let n=0;for(let d=new Date(a);d<=b;d=addDays(d,1))if(cfg(sid).days.includes(d.getDay()))n++;return n}
function progressData(sid){const T=totals(sid),s=chartStart(sid),e=parse(cfg(sid).deadline),t=todayD();
  const N=Math.max(1,studyDaysIn(sid,s,e));const doneByDay={};
  for(const u of SUB(sid).units)u.t.forEach((_,i)=>{const d=state.done[tid(u,i)];if(d)doneByDay[d]=(doneByDay[d]||0)+topicH(u,i)});
  const plan=d=>T.tot*Math.min(1,studyDaysIn(sid,s,d)/N);let acc=0;const act=[];
  for(const k of Object.keys(doneByDay).filter(k=>k<iso(s)))acc+=doneByDay[k];
  for(let d=new Date(s);d<=t&&d<=e;d=addDays(d,1)){acc+=doneByDay[iso(d)]||0;act.push([new Date(d),acc])}
  return{T,s,e,t,plan,act,delta:acc-plan(t<e?t:e)}}
function chartSvg(sid){const D=progressData(sid);if(D.e<=D.s||D.T.tot<=0)return"";
  const W=320,H=150,L=8,R=8,TP=14,B=22,x=d=>L+(W-L-R)*Math.min(1,Math.max(0,(d-D.s)/(D.e-D.s))),y=v=>TP+(H-TP-B)*(1-v/D.T.tot);
  const pts=[];for(let d=new Date(D.s);d<=D.e;d=addDays(d,Math.max(1,Math.round(daysBetween(D.s,D.e)/60))))pts.push([d,D.plan(d)]);pts.push([D.e,D.plan(D.e)]);
  const pl=pts.map(([d,v])=>`${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ac=D.act.map(([d,v])=>`${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last=D.act[D.act.length-1],tx=x(D.t<D.e?D.t:D.e);
  const area=D.act.length?`${x(D.act[0][0]).toFixed(1)},${y(0)} ${ac} ${x(last[0]).toFixed(1)},${y(0)}`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres postępu: plan a rzeczywistość">
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="ax"/><line x1="${L}" x2="${W-R}" y1="${y(D.T.tot)}" y2="${y(D.T.tot)}" class="grid"/>
    <line x1="${tx}" x2="${tx}" y1="${TP-6}" y2="${y(0)}" class="today"/>
    <polyline points="${pl}" class="plan"/>${area?`<polygon points="${area}" class="area"/>`:""}${ac?`<polyline points="${ac}" class="act"/>`:""}
    ${last?`<circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" class="dot"/>`:""}
    <text x="${L}" y="${H-6}" class="lab">${shortDate(D.s)}</text>${tx-x(D.s)>40&&x(D.e)-tx>40?`<text x="${tx}" y="${H-6}" class="lab" text-anchor="middle">dziś</text>`:""}<text x="${W-R}" y="${H-6}" class="lab" text-anchor="end">${shortDate(D.e)}</text>
    <text x="${W-R}" y="${TP-4}" class="lab" text-anchor="end">${fmtH(D.T.tot)}</text></svg>`}
function chartCard(sid){
  if(!SUB(sid).units.some(u=>u.t.some((_,i)=>state.done[tid(u,i)])))return `<section class="card chartcard subj-${sid}"><h3 style="font-size:16px">Postęp a plan</h3>
    <p class="hint">Wykres pojawi się po odhaczeniu ${isTasks(sid)?"pierwszego zadania":"pierwszego tematu"}.</p></section>`;
  const D=progressData(sid),svg=chartSvg(sid);if(!svg)return"";const d=D.delta;
  const msg=Math.abs(d)<0.25?"Idziesz równo z planem.":d>0?`Jesteś <b>${fmtH(d)} do przodu</b> względem planu.`:`Jesteś <b>${fmtH(-d)} do tyłu</b> względem planu.`;
  return `<section class="card chartcard subj-${sid}"><div class="row"><h3 style="font-size:16px">Postęp a plan</h3>
    <span class="legend"><i class="lp"></i>plan <i class="la"></i>Ty</span></div>${svg}<p class="hint">${msg}</p></section>`}

/* --- stoper i tempo nauki --- */
let timerT=null;
function timerMin(){return state.timer?Math.floor((Date.now()-state.timer.start)/60000):0}
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0")}
function renderTimerBar(){let el=$("#timerBar");
  if(!state.timer){if(el)el.remove();clearInterval(timerT);timerT=null;return}
  if(!el){el=document.createElement("div");el.id="timerBar";el.className="timerbar";document.body.appendChild(el)}
  const s=SUB(state.timer.sid);el.className=`timerbar subj-${state.timer.sid}`;
  el.innerHTML=`<span class="tdot"></span><span class="tl">${esc(s?s.short:"Nauka")}</span><b class="num" id="timerClock">${fmtClock(Date.now()-state.timer.start)}</b><button class="btn" data-timer-stop>Stop</button>`;
  if(!timerT)timerT=setInterval(()=>{const c=$("#timerClock");if(c&&state.timer)c.textContent=fmtClock(Date.now()-state.timer.start)},1000)}
function stopTimer(){if(!state.timer)return 0;const m=timerMin(),sid=state.timer.sid,k=iso(todayD());
  if(m>=1){state.time[k]=state.time[k]||{};state.time[k][sid]=(state.time[k][sid]||0)+m}state.timer=null;return m}
const minutesOn=(k,sid)=>((state.time[k]||{})[sid]||0);
function pace(sid){const from=(state.paceFrom||{})[sid]||"";let act=0,plan=0,days=0;
  for(const k of Object.keys(state.time)){if(k<from)continue;const m=minutesOn(k,sid);if(!m)continue;const p=doneHoursOn(sid,k);if(p<=0)continue;act+=m/60;plan+=p;days++}
  if(days<2||plan<3)return null;return act/plan}
function paceCard(sid){const f=pace(sid);if(!f||Math.abs(f-1)<0.15)return"";
  return `<section class="card subj-${sid}"><h3 style="font-size:16px">Twoje tempo</h3>
    <p class="hint">Według stopera przerabiasz tematy <b>${fmtN(f,1)}× ${f>1?"wolniej":"szybciej"}</b>, niż zakłada plan.</p>
    <div class="btns"><button class="btn" data-pace-apply="${sid}">Dopasuj czas działów</button><button class="btn ghost" data-pace-skip="${sid}">Nie teraz</button></div></section>`}

function groupsOf(sid){const out=[];for(const u of SUB(sid).units){if(!out.some(g=>g.n===u.n))out.push({n:u.n,name:u.g||u.name})}return out}

function examChart(list){if(list.length<1)return"";const W=320,H=130,L=26,R=10,TP=10,B=20;const s=list.map(e=>parse(e.date)),a=Math.min(...s),b=Math.max(...s);

/* --- kalendarz (.ics) --- */
function icsText(){const pad2=n=>String(n).padStart(2,"0"),stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const [hh,mm]=(state.calTime||"17:00").split(":").map(Number);const BY=["SU","MO","TU","WE","TH","FR","SA"];
  const ev=ACTIVE().filter(s=>cfg(s.id).days.length).map(s=>{const c=cfg(s.id);let d=startD(s.id);for(let i=0;i<7&&!c.days.includes(d.getDay());i++)d=addDays(d,1);
    const dl=parse(c.deadline),mins=Math.round(c.hpd*60);
    const dt=`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(hh)}${pad2(mm)}00`;
    return ["BEGIN:VEVENT",`UID:planer-${s.id}-${Date.now()}@planer`,`DTSTAMP:${stamp}`,`DTSTART:${dt}`,`DURATION:PT${Math.floor(mins/60)}H${mins%60}M`,
      `RRULE:FREQ=WEEKLY;BYDAY=${c.days.map(x=>BY[x]).join(",")};UNTIL=${dl.getFullYear()}${pad2(dl.getMonth()+1)}${pad2(dl.getDate())}T235959Z`,
      `SUMMARY:Nauka: ${s.short} (${fmtH(c.hpd)})`,"DESCRIPTION:Plan na dziś znajdziesz w Planerze Maturalnym.",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Czas na naukę","TRIGGER:-PT10M","END:VALARM","END:VEVENT"].join("\r\n")});
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planer Maturalny//PL","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n")}
function addToCalendar(){const ics=icsText();
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="planer-nauka.ics";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Otwórz pobrany plik, żeby dodać do kalendarza")}catch(_){toast("Nie udało się utworzyć pliku kalendarza")}}
function calendarCard(){if(IN_CLAUDE)return"";

    <div class="row"><span>Godzina nauki</span><input type="time" id="calTime" value="${state.calTime||"17:00"}"></div>

function taskCard(it){

    if(!downloads){try{state.lastBackup=iso(todayD());const blob=new Blob([JSON.stringify(state)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`planer-matura-${iso(todayD())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);commit();toast("Kopia pobrana – sprawdź Pliki › Pobrane")}catch(_){toast("Nie udało się pobrać – użyj kopii jako tekst")}return}
    try{state.lastBackup=iso(todayD());await downloads.save({filename:`planer-matura-${iso(todayD())}.json`,data:JSON.stringify(state)});commit();toast("Kopia zapisana")}
    catch(err){state.lastBackup=undefined;try{const raw=localStorage.getItem(LS);if(raw)state.lastBackup=JSON.parse(raw).lastBackup}catch(_){}
      if(err&&err.code==="unavailable")toast("Pobieranie niedostępne – użyj kopii jako tekst");else toast("Nie zapisano kopii")}
    return}
  if(b.dataset.reset){if(b.dataset.reset==="ask")confirmReset=true;else if(b.dataset.reset==="yes"){const keep=state.settings,sub=state.subject,en=state.enabled;state=freshState();state.settings=keep;state.subject=sub;state.enabled=en;confirmReset=false;commit();toast("Wyczyszczono");return}else confirmReset=false;render();return}
});

/* ======================= INSTALACJA NA EKRANIE TELEFONU ======================= */
const UA=navigator.userAgent||"";
const IS_IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/.test(UA);
const IN_APP_BROWSER=/TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV|FB_IAB|Snapchat/i.test(UA);
const IS_STANDALONE=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
let installEvt=null,installHidden=false,installGuide=false,justInstalled=false;
try{installHidden=localStorage.getItem("planer-install-hidden")==="1"}catch(e){}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;render()});
window.addEventListener("appinstalled",()=>{installEvt=null;installGuide=false;justInstalled=true;render();
  toast("Gotowe! Planer jest na ekranie jako „Matura”.")});
let installTab=IS_IOS?"ios":"android";
const osNow=()=>IS_IOS?"ios":IS_ANDROID?"android":installTab;
function installSteps(os){
  if(IN_APP_BROWSER)return `<ol class="steps"><li>Jesteś w przeglądarce TikToka albo Instagrama, a z niej nie da się dodać apki.</li><li>Stuknij <b>${os==="ios"?"⋯":"⋮"}</b> w rogu ekranu i wybierz <b>„Otwórz w przeglądarce”</b>${os==="ios"?" (Safari)":" (Chrome)"}.</li><li>Tam stuknij jeszcze raz <b>„Dodaj do ekranu”</b>.</li></ol>`;
  if(os==="ios")return `<ol class="steps"><li>Stuknij <b>Udostępnij</b> (kwadrat ze strzałką w górę) na dolnym pasku Safari. Jeśli go nie widzisz, stuknij najpierw <b>⋯</b>.</li><li>Przewiń w dół i wybierz <b>„Do ekranu początkowego”</b>.</li><li>Stuknij <b>Dodaj</b> w prawym górnym rogu.</li><li>Gotowe, otwieraj planer z ikonki <b>„Matura”</b>.</li></ol>`;
  return `<ol class="steps"><li>Stuknij menu <b>⋮</b> w prawym górnym rogu Chrome.</li><li>Wybierz <b>„Zainstaluj aplikację”</b> albo <b>„Dodaj do ekranu głównego”</b>.</li><li>Potwierdź przyciskiem <b>Zainstaluj</b>.</li><li>Gotowe, otwieraj planer z ikonki <b>„Matura”</b>.</li></ol>`}
function installCard(){
  if(IS_STANDALONE())return "";
  if(justInstalled)return `<section class="card install done"><h3 style="font-size:16px">Planer zainstalowany 🎉</h3><p class="hint">Znajdziesz go na ekranie telefonu jako <b>„Matura”</b>. Otwieraj go stamtąd, wtedy postęp na pewno się zachowa.</p></section>`;
  if(installHidden)return "";
  const os=osNow();
  return `<section class="card install"><div class="row"><h3 style="font-size:16px">Dodaj planer na ekran telefonu</h3><button class="link" data-install-hide>Ukryj</button></div>
    <p class="hint">Wtedy otwiera się jak zwykła aplikacja, na pełnym ekranie, i działa bez internetu. Postęp zapisuje się tylko w Twoim telefonie.</p>
    <button class="btn" data-install-go>${installEvt?"Zainstaluj aplikację":"Dodaj do ekranu"}</button>
    ${!IS_IOS&&!IS_ANDROID?`<div class="subj"><button class="chip" aria-pressed="${os==="ios"}" data-install-os="ios">iPhone</button><button class="chip" aria-pressed="${os==="android"}" data-install-os="android">Android</button></div>${installSteps(os)}`:""}
  </section>`}
function installOverlay(){
  const el=document.getElementById("installGuide");if(!installGuide){if(el)el.remove();return}
  const os=osNow();
  const box=el||Object.assign(document.createElement("div"),{id:"installGuide",className:"iguide"});
  box.className=`iguide ${os}${IN_APP_BROWSER?" inapp":""}`;
  box.innerHTML=`<div class="iguide-card" role="dialog" aria-modal="true" aria-label="Jak dodać planer na ekran">
    <h3>${IN_APP_BROWSER?"Najpierw otwórz w przeglądarce":os==="ios"?"Dodaj do ekranu w 3 krokach":"Zainstaluj w 3 krokach"}</h3>
    ${installSteps(os)}
    <button class="btn ghost" data-install-close>Rozumiem</button></div>
    <div class="iguide-arrow" aria-hidden="true">${os==="ios"&&!IN_APP_BROWSER?"↓":"↑"}</div>`;
  if(!el)document.body.appendChild(box)}
const _render=render;render=function(){_render();installOverlay()};
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-install-hide")){installHidden=true;try{localStorage.setItem("planer-install-hidden","1")}catch(_){}render();toast("Instrukcję znajdziesz też w Ustawieniach");return}
  if(b.hasAttribute("data-install-go")){
    if(installEvt){installEvt.prompt();let r=null;try{r=await installEvt.userChoice}catch(_){}installEvt=null;
      if(r&&r.outcome==="accepted"){justInstalled=true;toast("Instaluję… ikonka „Matura” pojawi się na ekranie")}render();return}
    installGuide=true;render();return}
  if(b.hasAttribute("data-install-close")){installGuide=false;render();return}
  if(b.dataset.installOs){installTab=b.dataset.installOs;render();return}
});
document.addEventListener("click",e=>{if(e.target.id==="installGuide"){installGuide=false;render()}});
(function firstOpen(){try{if(IS_STANDALONE()&&!localStorage.getItem("planer-welcomed")){localStorage.setItem("planer-welcomed","1");setTimeout(()=>toast("Witaj w aplikacji! Twój postęp zapisuje się w telefonie."),600)}}catch(e){}})();
extraSettings=function(){return IS_STANDALONE()?"":`<section class="card"><h3 style="font-size:16px">Dodaj planer na ekran telefonu</h3>${installSteps(osNow())}</section>`};
footerSettings=function(){return "  <section class=\"card\"><h3 style=\"font-size:16px\">Pomoc i kontakt</h3>\n    <p class=\"hint\">Coś nie działa albo brakuje Ci przedmiotu? Napisz do mnie na TikToku, odpisuję w wiadomościach.</p>\n    <a class=\"btn tt\" href=\"https://www.tiktok.com/@zdammatme\" target=\"_blank\" rel=\"noopener\">TikTok: @zdammatme</a>\n    <p class=\"hint\">Jak piszesz w sprawie błędu, podaj model telefonu i zrzut ekranu.</p>\n    <p class=\"hint\">Planer anonimowo liczy, ile osób z niego korzysta, bez ciasteczek i bez danych osobowych. Twój postęp nigdzie nie jest wysyłany.</p></section>\n  <p class=\"hint copy\">© 2026 matematykaop. Wszelkie prawa zastrzeżone.<br>Kopiowanie wyglądu i kodu aplikacji bez zgody autora jest zabronione.</p>"};
render();
</script>
